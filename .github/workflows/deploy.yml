name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/Harvesting-backend

            git fetch origin
            git reset --hard origin/main

            chmod +x mvnw
            ./mvnw clean package -DskipTests

            # Kill the process using port 4000 (if any)
            PID=$(lsof -ti:4000 || true)
            if [ -n "$PID" ]; then
              kill -9 $PID
              sleep 2
            fi

            nohup java -jar target/harvestflow-backend-0.1.0.jar > app.log 2>&1 < /dev/null &

            echo "Waiting for Spring Boot..."

            for i in {1..30}; do
                if lsof -i:4000 >/dev/null 2>&1; then
                    echo "Backend started successfully"
                    exit 0
                fi

                sleep 2
            done

            echo "Backend failed"
            tail -100 app.log
            exit 1