name: Test and deploy backend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run AI service tests
        working-directory: ai-service
        run: |
          pip install -q -r requirements-dev.txt
          pytest -q
      - name: Run backend tests
        run: |
          chmod +x mvnw || true
          if [ -x ./mvnw ] && [ -f .mvn/wrapper/maven-wrapper.properties ]; then ./mvnw -B test; else mvn -B test; fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Harvesting-backend
            git fetch origin
            git reset --hard origin/main
            chmod +x mvnw deploy/*.sh
            ./mvnw -q clean package -DskipTests
            ./deploy/restart-ai.sh
            ./deploy/restart-backend.sh
