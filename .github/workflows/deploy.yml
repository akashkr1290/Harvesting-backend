name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd ~/Harvesting-backend

            git fetch origin
            git reset --hard origin/main

            chmod +x mvnw
            ./mvnw clean package -DskipTests

            PID=$(pgrep -f "target/harvestflow-backend-0.1.0.jar" || true)
            if [ -n "$PID" ]; then
              kill -9 "$PID"
            fi

            nohup java -jar target/harvestflow-backend-0.1.0.jar > app.log 2>&1 < /dev/null &

            sleep 10

            if pgrep -f "target/harvestflow-backend-0.1.0.jar" >/dev/null; then
              echo "✅ Backend deployed successfully."
            else
              echo "❌ Backend failed to start."
              tail -50 app.log
              exit 1
            fi