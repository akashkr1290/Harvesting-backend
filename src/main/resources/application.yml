spring:
  application:
    name: harvestflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/harvestflow}
    username: ${DB_USERNAME:harvestflow}
    password: ${DB_PASSWORD:harvestflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' is convenient for early development; switch to a real
      # migration tool (Flyway/Liquibase) before production and set this
      # to 'validate'.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:4000}

harvestflow:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-change-it-before-any-real-deployment-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  seed:
    enabled: ${SEED_ENABLED:true}

logging:
  level:
    com.harvestflow: INFO
