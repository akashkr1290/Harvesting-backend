spring:
  application:
    name: harvestflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/harvestflow}
    username: ${DB_USERNAME:harvestflow}
    password: ${DB_PASSWORD:harvestflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations (db/migration/) now, not
      # Hibernate. 'validate' makes Hibernate check its entity mappings
      # against the actual schema at startup and refuse to run if they've
      # drifted — a loud failure here beats a silent mismatch discovered
      # later. Never set this back to 'update'/'create' outside a throwaway
      # local experiment.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:4000}

harvestflow:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-change-it-before-any-real-deployment-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  seed:
    enabled: ${SEED_ENABLED:true}
  uploads:
    dir: ${UPLOADS_DIR:uploads}
  cors:
    # Comma-separated list of allowed origins. Defaults to common local
    # dev addresses (Flutter web/debug, Android emulator) — never "*" in
    # any profile; application-prod.yml requires this to be set explicitly
    # with no fallback, so a prod deploy can't accidentally inherit a dev
    # default.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:3000,http://10.0.2.2}
  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
  password-reset:
    token-expiry-minutes: ${PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:30}
  image-verification:
    # heuristic = rule-based checks in HeuristicImageAuthenticityService (default, no external calls).
    # mock      = ImageAuthenticityService.MockImageAuthenticityService — dev/test only, performs NO real
    #             analysis. Never set this in application-prod.yml.
    # external  = Python AI service (ExternalImageAuthenticityService); needs AI_ENABLED=true.
    #             Falls back to the heuristic checks if the AI service does not answer.
    provider: ${IMAGE_VERIFICATION_PROVIDER:heuristic}
  otp:
    # true = the fixed code 123456 is accepted and real OTPs are printed in
    # the log. Local development only; application-prod.yml turns it off.
    dev-mode: ${OTP_DEV_MODE:true}
  sms:
    # log  = print messages in the server log only (development)
    # http = send through any HTTP SMS gateway, see HttpSmsSender
    provider: ${SMS_PROVIDER:log}
    http:
      url: ${SMS_HTTP_URL:}
      method: ${SMS_HTTP_METHOD:GET}
      body: ${SMS_HTTP_BODY:}
      auth-header: ${SMS_HTTP_AUTH_HEADER:}
      auth-value: ${SMS_HTTP_AUTH_VALUE:}
  marketplace:
    # Pending offers expire after this many hours.
    offer-validity-hours: ${MARKETPLACE_OFFER_VALIDITY_HOURS:72}
    # Orders up to this many kg skip the internal 11-stage workflow and are
    # delivered directly (FulfilmentMode.DIRECT). 0 = every order uses the
    # internal workflow, which was the previous behaviour.
    direct-max-kg: ${MARKETPLACE_DIRECT_MAX_KG:0}
  registration:
    # Aadhaar OTP needs a UIDAI-licensed partner (AUA/KUA). Until one is
    # integrated, registration works with mobile OTP only.
    aadhaar-required: ${REGISTRATION_AADHAAR_REQUIRED:false}
  ai:
    # Python AI service in ai-service/ (forecasting, routing, photo checks, mandi prices).
    # When false or unreachable, the built-in rule-based code is used.
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
    api-key: ${AI_API_KEY:}
  payment:
    # mock     = MockPaymentGatewayService (default) — no real gateway, every result is simulated.
    # external = seam for a real gateway (ExternalPaymentGatewayService) — not implemented in this
    #            environment (no network access, no gateway credentials); throws until wired.
    provider: ${PAYMENT_PROVIDER:mock}

logging:
  level:
    com.harvestflow: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

