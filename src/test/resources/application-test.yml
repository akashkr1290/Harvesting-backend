spring:
  datasource:
    url: jdbc:h2:mem:harvestflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

harvestflow:
  jwt:
    secret: test-only-secret-not-used-in-any-real-environment-0123456789
  seed:
    enabled: false
  cors:
    allowed-origins: http://localhost
